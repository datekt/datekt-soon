<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена — Datekt</title>
    <link rel="icon" type="image/png" href="datekt-logo.png">

    <script>
        (function () {
            try {
                var t = localStorage.getItem('datekt-theme') || 'dark';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>

    <style>
        @font-face {
            font-family: 'Datekt-Black';
            src: url('Datekt-Black.ttf') format('truetype');
            font-weight: bold;
        }
        @font-face {
            font-family: 'Datekt-Regular';
            src: url('Datekt-Regular.ttf') format('truetype');
            font-weight: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #67d934;
            --accent-glow: rgba(103, 217, 52, 0.35);
            --accent-glow-soft: rgba(103, 217, 52, 0.12);
        }

        html[data-theme="dark"] {
            --bg: #0d1117;
            --bg-soft: #161b22;
            --bg-soft-2: #1c2129;
            --border: #21262d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --text-strong: #ffffff;
            --grid-line: rgba(139, 148, 158, 0.06);
            --btn-hover-shadow: rgba(0, 0, 0, 0.45);
            --toggle-bg: rgba(22, 27, 34, 0.85);
        }

        html[data-theme="light"] {
            --bg: #f6f8fa;
            --bg-soft: #ffffff;
            --bg-soft-2: #f3f5f8;
            --border: #d0d7de;
            --text: #1f2328;
            --text-dim: #59636e;
            --text-strong: #0a0c10;
            --grid-line: rgba(31, 35, 40, 0.06);
            --btn-hover-shadow: rgba(31, 35, 40, 0.12);
            --toggle-bg: rgba(255, 255, 255, 0.85);
        }

        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation: none;
            mix-blend-mode: normal;
        }
        ::view-transition-old(root) { z-index: 1; }
        ::view-transition-new(root) { z-index: 2; }

        html.theme-anim,
        html.theme-anim *,
        html.theme-anim *::before,
        html.theme-anim *::after {
            transition:
                background-color 0.5s ease,
                background 0.5s ease,
                color 0.5s ease,
                border-color 0.5s ease,
                box-shadow 0.5s ease,
                fill 0.5s ease,
                stroke 0.5s ease !important;
        }

        html, body { height: 100%; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Datekt-Regular', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
            isolation: isolate;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(ellipse at 50% 0%, var(--accent-glow-soft), transparent 55%),
                radial-gradient(ellipse at 50% 100%, var(--accent-glow-soft), transparent 55%),
                var(--bg);
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            from { background-position: 0 0, 0 0; }
            to   { background-position: 40px 40px, 40px 40px; }
        }

        ::selection { background: var(--accent); color: #0d1117; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: var(--toggle-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px var(--btn-hover-shadow);
            view-transition-name: theme-toggle-btn;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: rotate(20deg) scale(1.05);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .theme-toggle svg { width: 22px; height: 22px; }
        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            position: absolute;
            transition: opacity 0.3s ease, transform 0.4s ease;
        }
        html[data-theme="dark"] .theme-toggle .icon-sun  { opacity: 0; transform: rotate(-90deg) scale(0.5); }
        html[data-theme="dark"] .theme-toggle .icon-moon { opacity: 1; transform: rotate(0) scale(1); }
        html[data-theme="light"] .theme-toggle .icon-sun  { opacity: 1; transform: rotate(0) scale(1); }
        html[data-theme="light"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); }

        ::view-transition-old(theme-toggle-btn),
        ::view-transition-new(theme-toggle-btn) {
            animation: none;
        }
        ::view-transition-old(theme-toggle-btn) { display: none; }
        ::view-transition-new(theme-toggle-btn) { mix-blend-mode: normal; }

        .main-container {
            text-align: center;
            max-width: 620px;
            width: 100%;
            margin: auto;
            animation: fadeInUp 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .error-code {
            font-family: 'Datekt-Black', sans-serif;
            font-size: 9rem;
            line-height: 1;
            letter-spacing: -4px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, var(--text-strong) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 28px var(--accent-glow));
            animation: codeGlow 3s ease-in-out infinite;
        }
        @keyframes codeGlow {
            0%, 100% { filter: drop-shadow(0 0 24px var(--accent-glow)); }
            50%      { filter: drop-shadow(0 0 44px rgba(103, 217, 52, 0.65)); }
        }

        .divider {
            width: 60px;
            height: 3px;
            margin: 6px auto 26px;
            border-radius: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .title {
            font-family: 'Datekt-Black', sans-serif;
            font-size: 2.1rem;
            color: var(--text-strong);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .description {
            font-size: 1.05rem;
            color: var(--text-dim);
            margin-bottom: 44px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 10px;
            text-decoration: none;
            font-family: 'Datekt-Regular', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-strong);
            background: var(--bg-soft);
            border: 1px solid var(--border);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-home.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #0d1117;
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .btn-home.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px var(--accent-glow);
            filter: brightness(1.08);
        }

        .btn-home:hover {
            background: var(--bg-soft-2);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 24px var(--btn-hover-shadow);
        }

        footer {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-align: center;
            margin-top: 40px;
            letter-spacing: 0.5px;
        }
        footer span { color: var(--accent); }

        @media (max-width: 480px) {
            .error-code { font-size: 6rem; letter-spacing: -3px; }
            .title { font-size: 1.5rem; }
            .description { font-size: 0.95rem; }
            .theme-toggle { width: 42px; height: 42px; top: 14px; right: 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему" title="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
        </svg>
    </button>

    <div class="main-container">
        <div class="error-code">404</div>
        <div class="divider"></div>

        <h1 class="title">Страница не найдена</h1>
        <p class="description">
            Возможно, она была удалена, переименована или никогда не существовала.<br>
            Но не волнуйтесь — вы всегда можете вернуться назад.
        </p>

        <div class="actions">
            <a href="index.html" class="btn-home primary">← На главную</a>
            <a href="javascript:history.back()" class="btn-home">Назад</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Datekt Media. Разработано <span>для людей</span>.
    </footer>

    <script>
        const themeToggle = document.getElementById('themeToggle');

        function applyTheme(next) {
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('datekt-theme', next); } catch (e) {}
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';

            if (!document.startViewTransition) {
                const root = document.documentElement;
                root.classList.add('theme-anim');
                applyTheme(next);
                setTimeout(() => root.classList.remove('theme-anim'), 550);
                return;
            }

            const rect = themeToggle.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            const endRadius = Math.hypot(
                Math.max(x, window.innerWidth - x),
                Math.max(y, window.innerHeight - y)
            );

            const transition = document.startViewTransition(() => applyTheme(next));

            transition.ready.then(() => {
                document.documentElement.animate(
                    {
                        clipPath: [
                            `circle(0px at ${x}px ${y}px)`,
                            `circle(${endRadius}px at ${x}px ${y}px)`
                        ]
                    },
                    {
                        duration: 700,
                        easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                        pseudoElement: '::view-transition-new(root)'
                    }
                );
            });
        }

        themeToggle.addEventListener('click', toggleTheme);
    </script>

</body>
</html>
